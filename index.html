<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeployPanel example FE Divya</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0f172a;
        --card: #1e293b;
        --text: #e2e8f0;
        --accent: #38bdf8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at top, #1e3a5f, var(--bg));
        color: var(--text);
        display: grid;
        place-items: center;
      }
      main {
        width: min(520px, 92vw);
        background: color-mix(in srgb, var(--card) 92%, black);
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 1.75rem;
        box-shadow: 0 20px 50px rgb(0 0 0 / 35%);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1rem;
        color: #94a3b8;
        line-height: 1.5;
      }
      button {
        background: var(--accent);
        color: #0f172a;
        border: 0;
        border-radius: 8px;
        padding: 0.6rem 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      pre {
        margin-top: 1rem;
        background: #020617;
        border-radius: 8px;
        padding: 0.85rem;
        overflow: auto;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DeployPanel example Divya</h1>
      <p>
        Static nginx frontend talking to the generated Node API (+ Postgres)
        deployed without hand-written Dockerfiles.
      </p>
      <button type="button" id="ping">Call API</button>
      <pre id="out">Click “Call API”…</pre>
    </main>
    <script>
      const out = document.getElementById("out");
      document.getElementById("ping").addEventListener("click", async () => {
        out.textContent = "Loading…";
        try {
          // Same-origin proxy path is not set up; call published API host port.
          const apiBase =
            window.API_BASE ||
            `${location.protocol}//${location.hostname}:3001`;
          const res = await fetch(`${apiBase}/api/hello`);
          const data = await res.json();
          out.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          out.textContent = String(err);
        }
      });
    </script>
  </body>
</html>
